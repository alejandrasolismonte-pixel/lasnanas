# WEBHOOK PRIVADO: Supabase no exige JWT porque la función valida su secreto interno obligatorio.
[functions.send-volunteer-registration-notifications]
verify_jwt = false

# Ingesta anónima de eventos: origen/rutas/payload limitados; solo escritura en servidor.
# No hay endpoint público de lectura de métricas ni de resúmenes.
[functions.collect-site-activity]
verify_jwt = false

# Worker de servidor: exige secreto de webhook privado; jamás admite llamadas del navegador.
[functions.send-site-activity-reports]
verify_jwt = false
