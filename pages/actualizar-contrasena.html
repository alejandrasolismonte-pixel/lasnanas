<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Actualizar contraseña · Las Ñañas</title><link rel="stylesheet" href="../css/mi-voluntariado.css?v=2"><link rel="stylesheet" href="../css/loading-overlay.css?v=2"></head><body>
<!-- RECUPERACIÓN: esta página solo se habilita con una sesión válida entregada por Supabase. -->
<main class="portal-wrap"><section class="content-card"><p class="eyebrow">Recuperar acceso</p><h1>Elige una contraseña nueva</h1><form data-password-update novalidate><label>Nueva contraseña<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Repite la contraseña<input name="confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">Actualizar contraseña</button><p class="field-message" data-password-status aria-live="polite"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-client.js?v=1"></script><script src="../js/loading-overlay.js?v=2"></script><script src="../js/actualizar-contrasena.js?v=3"></script></body></html>
