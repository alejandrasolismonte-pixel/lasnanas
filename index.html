<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050608">
    <meta name="description" content="Una entrada desde Wallmapu al universo de Las Ñañas.">
    <title>Las Ñañas · Raíces que cuidan</title>

    <!-- Oswald se aplica únicamente a esta entrada cinematográfica. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/loading-overlay.css?v=2">
    <link rel="stylesheet" href="css/public-backgrounds.css?v=1">
    <link rel="stylesheet" href="css/cinematic-entry.css?v=1">
    <link rel="prefetch" href="desarrollo.html">
</head>
<body class="cinematic-entry">
    <a class="cinema__skip" href="desarrollo.html">Saltar introducción</a>

    <main class="cinema" aria-label="Introducción a Las Ñañas">
        <section class="cinema__scene cinema__scene--fire is-active" data-scene="fire" aria-label="Fuego de bienvenida">
            <video class="cinema__video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
                <source src="assets/videos/video-header" type="video/webm">
                <source src="assets/videos/video-header-iphone.mp4" type="video/mp4">
            </video>
        </section>

        <section class="cinema__scene cinema__scene--story" data-scene="story" aria-hidden="true">
            <ol class="cinema__places" aria-label="Desde Wallmapu hasta el universo">
                <li>WALLMAPU</li>
                <li>ARAUCANÍA</li>
                <li>CHILE</li>
                <li>SUDAMÉRICA</li>
                <li>UNIVERSO</li>
            </ol>
            <div class="cinema__identity">
                <h1 class="cinema__title">Ñañas <span aria-hidden="true">·</span> Raíces que cuidan</h1>
                <p class="cinema__subtitle">Redes para territorios</p>
            </div>
        </section>

        <section class="cinema__scene cinema__scene--gate" data-scene="gate" aria-hidden="true" aria-label="Compuerta hacia Las Ñañas">
            <div class="cinema__stars" aria-hidden="true"></div>
            <div class="cinema__portal" aria-hidden="true"></div>
            <div class="cinema__door cinema__door--left" aria-hidden="true"></div>
            <div class="cinema__door cinema__door--right" aria-hidden="true"></div>
            <div class="cinema__seam" aria-hidden="true"></div>
            <div class="cinema__horizon" aria-hidden="true"></div>
        </section>
    </main>

    <noscript><a class="cinema__no-script" href="desarrollo.html">Entrar a Las Ñañas</a></noscript>

    <script src="js/loading-overlay.js?v=2"></script>
    <script src="js/cinematic-entry.js?v=1"></script>
</body>
</html>
